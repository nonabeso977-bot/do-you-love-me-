<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beat Orbit | Sadeem Stage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#e9e5dc;color:#20252b}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,100svh);height:min(100vw,100svh);aspect-ratio:1/1;overflow:hidden;background:#f7f4ed url("https://raw.githubusercontent.com/nonabeso977-bot/do-you-love-me-/main/%D8%A8%D8%AF%D9%88%D9%86%20%D8%A7%D8%B3%D9%8513_20261124014011.png") center/100% 100% no-repeat;isolation:isolate}
.topbar{position:absolute;z-index:10;top:2%;left:2%;right:2%;display:flex;justify-content:space-between;align-items:center;direction:ltr;pointer-events:none}
.logo,.stat{background:#fff9;border:2px solid #252525;border-radius:5px;padding:clamp(4px,1.3vw,9px) clamp(6px,1.7vw,13px);font-size:clamp(8px,2vw,13px);font-weight:900;color:#20252b}
.stats{display:flex;gap:5px}
.character{position:absolute;z-index:5;left:-1%;bottom:0;width:38%;height:58%;object-fit:contain;object-position:left bottom;pointer-events:none;filter:drop-shadow(0 2px 1px #3334)}
.playfield{position:absolute;inset:0;z-index:4;pointer-events:none}
.note{position:absolute;width:7.5%;height:3.2%;border:2px solid #252525;border-radius:5px;box-shadow:0 2px 0 #0002;transform:translate(-50%,-50%);animation:noteTravel var(--duration,2.7s) linear forwards;z-index:6}
.note[data-lane="0"],.note[data-lane="3"]{background:#48b85b}
.note[data-lane="1"],.note[data-lane="4"]{background:#e85a60}
.note[data-lane="2"]{background:#f2d34c}
@keyframes noteTravel{from{top:24%;left:var(--from);opacity:0}10%{opacity:1}to{top:84%;left:var(--to);opacity:1}}
.hit-zones{position:absolute;z-index:8;left:23%;right:8%;bottom:13%;height:12%;display:grid;grid-template-columns:repeat(5,1fr);gap:1%;pointer-events:auto}
.hit-zone{border:0;background:transparent;min-width:0;touch-action:manipulation}
.hit-zone:active{background:#ffffff25}
.toast{position:absolute;z-index:12;top:13%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(16px,4vw,30px);color:#222;background:#fff9;border:2px solid #222;padding:4px 10px;opacity:0;transition:opacity .12s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.hudbottom{position:absolute;z-index:12;bottom:1%;left:50%;transform:translateX(-50%);background:#fff9;border:2px solid #252525;border-radius:5px;padding:4px 8px;font-size:clamp(8px,1.8vw,11px);white-space:nowrap}
.start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#f7f4edaa}
.startbox{background:#fffaf0;border:3px solid #252525;border-radius:5px;box-shadow:4px 4px 0 #777;padding:20px;text-align:center;width:min(82%,300px)}
.startbox h1{margin:0 0 8px;color:#24548c;font-size:clamp(20px,5vw,28px)}
.startbox p{font-size:13px;line-height:1.7}
button{font:inherit}.go{border:2px solid #252525;background:#e7c64b;color:#222;font-weight:bold;padding:10px 22px;border-radius:5px;cursor:pointer}
@media(max-aspect-ratio:1/1){.stage{width:100vw;height:100vw;flex:none}}
@media(min-aspect-ratio:1/1){.stage{width:100svh;height:100svh}}
</style>
</head>
<body>
<main class="stage" id="stage">
 <header class="topbar"><div class="logo">BEAT ORBIT</div><div class="stats"><div class="stat">COMBO <span id="combo">0</span></div><div class="stat">SCORE <span id="score">0</span></div><div class="stat">LIFE <span id="life">100</span>%</div></div></header>
 <img class="character" src="https://raw.githubusercontent.com/nonabeso977-bot/do-you-love-me-/main/%D8%A8%D8%AF%D9%88%D9%86%20%D8%A7%D8%B3%D9%8513_20261124014302.png" alt="سديم">
 <section class="playfield" id="playfield"></section>
 <div class="hit-zones" id="keys" aria-label="مناطق الضغط">
  <button class="hit-zone" data-key="a" aria-label="المسار الأول"></button>
  <button class="hit-zone" data-key="s" aria-label="المسار الثاني"></button>
  <button class="hit-zone" data-key="d" aria-label="المسار الثالث"></button>
  <button class="hit-zone" data-key="f" aria-label="المسار الرابع"></button>
  <button class="hit-zone" data-key="g" aria-label="المسار الخامس"></button>
 </div>
 <div class="toast" id="toast">PERFECT!</div>
 <div class="hudbottom">A S D F G أو المسّي مواضع البلاطات</div>
 <div class="start" id="start"><div class="startbox"><h1>مرحلة سديم</h1><p>الخلفية الأصلية محفوظة كما هي، وسديم طبقة مستقلة فوقها. ابدئي الاختبار لتجربة النوتات.</p><button class="go" id="go">ابدئي الاختبار</button></div></div>
</main>
<script>
const $=s=>document.querySelector(s),scoreEl=$('#score'),comboEl=$('#combo'),lifeEl=$('#life'),toast=$('#toast'),playfield=$('#playfield');
let score=0,combo=0,life=100,running=false,spawnTimer=null;
const codes=['a','s','d','f','g'];
const far=[34,40,46,52,58],near=[27,36,45,54,63];
function feedback(t){toast.textContent=t;toast.classList.add('show');clearTimeout(feedback.timer);feedback.timer=setTimeout(()=>toast.classList.remove('show'),450)}
function render(){scoreEl.textContent=score;comboEl.textContent=combo;lifeEl.textContent=life}
function spawn(){if(!running)return;const i=Math.floor(Math.random()*5),n=document.createElement('div');n.className='note';n.dataset.lane=i;n.style.setProperty('--from',far[i]+'%');n.style.setProperty('--to',near[i]+'%');n.style.setProperty('--duration',(2.5+Math.random()*.35)+'s');n.style.left=far[i]+'%';n.style.top='24%';playfield.appendChild(n);n.addEventListener('animationend',()=>{if(n.isConnected){n.remove();combo=0;life=Math.max(0,life-5);render();feedback('MISS');if(!life)stop()}})}
function hit(code){if(!running)return;const i=codes.indexOf(code);if(i<0)return;const notes=[...playfield.querySelectorAll('.note')].filter(n=>Number(n.dataset.lane)===i);if(!notes.length){combo=0;life=Math.max(0,life-2);feedback('MISS');render();return}notes.sort((a,b)=>Math.abs(a.getBoundingClientRect().top-innerHeight*.78)-Math.abs(b.getBoundingClientRect().top-innerHeight*.78));const n=notes[0],d=Math.abs(n.getBoundingClientRect().top-innerHeight*.78);n.remove();if(d<innerHeight*.09){const rank=d<innerHeight*.035?'PERFECT':d<innerHeight*.065?'GREAT':'GOOD';combo++;score+=rank==='PERFECT'?100:rank==='GREAT'?70:40;feedback(rank);if(combo%20===0)feedback(combo+' COMBO!')}else{combo=0;life=Math.max(0,life-3);feedback('MISS')}render()}
function start(){playfield.innerHTML='';score=0;combo=0;life=100;render();running=true;$('#start').style.display='none';spawnTimer=setInterval(spawn,760);spawn()}
function stop(){running=false;clearInterval(spawnTimer);$('#start').style.display='grid';$('#start h1').textContent='انتهت الجولة';$('#start p').textContent='النتيجة: '+score+' | أعلى كومبو: '+combo;$('#go').textContent='إعادة الاختبار'}
$('#go').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(codes.includes(e.key.toLowerCase())){e.preventDefault();hit(e.key.toLowerCase())}});
document.querySelectorAll('.hit-zone').forEach(b=>b.addEventListener('pointerdown',()=>hit(b.dataset.key)));
</script>
</body></html>
